model_id: google/efficientnet-b0 # google/efficientnet-b0 or google/vit-base-patch16-224
data_dir: data/
output_dir: outputs/
batch_size: 16
dropout: 0.2
drop_connect_rate: 0.4
augment: True
num_workers: 4
weight_decay: 0.01
warmup_ratio: 0.1
class_weighted_loss: True
seed: 42
device: auto

experiment_tag: EN_strategy1_unfreeze4
 
phases:
  # Phase 1: warm up the classifier head only, backbone fully frozen.
  - name: warmup
    epochs: 10
    lr: 1.0e-3
    unfreeze_depth: 0
 
  # Phase 2: unfreeze the last 4 transformer blocks (this is the value being
  # swept across runs -- try 0, 2, 4, 6, "all" as separate configs/experiment_tags).
  - name: partial_unfreeze
    epochs: 15
    lr: 8.0e-4
    unfreeze_depth: 4
